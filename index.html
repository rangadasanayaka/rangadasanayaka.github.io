<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .form-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin: 0 auto;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
        }
        .mobile-title {
            display: none;
            text-align: center;
            margin-bottom: 25px;
        }
        .desktop-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 28px;
        }
        .form-label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }
        .btn-submit {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border: none;
            padding: 14px;
            font-weight: 600;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s;
            border-radius: 8px;
            font-size: 18px;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(38, 117, 252, 0.4);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }
        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border-left: 4px solid #28a745;
        }
        .error-message {
            display: none;
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border-left: 4px solid #dc3545;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .mobile-title {
                display: block;
            }
            .desktop-title {
                display: none;
            }
            .form-container {
                padding: 25px 20px;
                margin: 15px;
            }
            body {
                padding: 10px 0;
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="text-center mb-3">
               <img src="logo-1.png" width="300" alt="Logo" class="img-fluid rounded-circle">
            </div>
            <h1 class="desktop-title">Registration Form</h1>

            <form id="registrationForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">First Name *</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Last Name *</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="telephone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="telephone">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="nonBinary" value="Non-binary">
                        <label class="form-check-label" for="nonBinary">Non-binary</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="fas fa-paper-plane me-2"></i> Submit Form
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Submitting your form...</p>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle me-2"></i> Form submitted successfully!
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle me-2"></i> <span id="errorText">Error submitting form. Please try again.</span>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxUkE9qbvFFGKmdwugcs0ETMkCA48Ujwlv38CvqKglZo4rCWYDbeaKdBVMbI9S-VL5ubQ/exec';

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loading = document.getElementById('loading');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const telephone = document.getElementById('telephone').value.trim();
                const email = document.getElementById('email').value.trim();
                const address = document.getElementById('address').value.trim();
                const gender = document.querySelector('input[name="gender"]:checked')?.value || '';

                if (!firstName || !lastName) {
                    showError('Please fill in both first and last names.');
                    return;
                }

                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
                loading.style.display = 'block';

                try {
                    const formData = { firstName, lastName, telephone, email, address, gender };

                    const response = await fetch(scriptURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (result.result === 'success') {
                        showSuccess();
                        form.reset();
                    } else {
                        showError(result.error || 'Error submitting form.');
                    }
                } catch (error) {
                    showError('Network error. Please try again.');
                    console.error(error);
                } finally {
                    loading.style.display = 'none';
                }
            });

            function showSuccess() {
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }

            function showError(message) {
                errorText.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
